# CI/CD — every push and PR runs the full keyless oracle (check, lint, build,
# unit, browser e2e); pushes to main additionally run the docker e2e (the
# repo's own packaging gate) and, only if everything is green, auto-bump the
# semver (from conventional commits), push the v* git tag, and publish a
# multi-arch image to GHCR. Publishing needs no secrets beyond the workflow's
# own GITHUB_TOKEN (contents: write for the tag, packages: write for the
# image). Versions come from this pipeline, not from manually pushed tags —
# tag pushes trigger nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run build
      # Serial forks: CI runners have few cores, and the suite's documented
      # contention flake (api.* timeouts under load) only appears in parallel
      # runs. ~90s serial beats a flaky 40s.
      - run: bunx vitest run --passWithNoTests --pool=forks --poolOptions.forks.maxForks=1
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The §28.8/Phase-4 docker oracle: build the real image, boot it, drive it
  # with a browser. This is what makes a published image trustworthy.
  docker-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:docker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Auto-version: each green main push gets the next semver, derived from the
  # conventional commits since the last tag (fix → patch, feat → minor,
  # BREAKING CHANGE / ! → major, anything else → patch). The tag is created
  # with GITHUB_TOKEN, which GitHub deliberately prevents from triggering
  # workflows — so publish consumes the version as a job output, never as a
  # tag event.
  version:
    runs-on: ubuntu-latest
    needs: [test, docker-e2e]
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the bump is computed from commits since the last tag
      - id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  publish:
    runs-on: ubuntu-latest
    needs: [test, docker-e2e, version]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # every green main push -> :latest + :main + the auto-bumped
          # :X.Y.Z + an immutable :sha-<short>.
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
